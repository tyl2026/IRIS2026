# =============================================================================
# 表头映射配置文件
# =============================================================================
#
# 【用途】
#   将各种接口文档的列名映射到系统内部的统一字段名。
#   解析器读取此配置后，能自动识别不同文档的表头格式。
#
# 【使用方法】
#   1. 当你拿到一份新的接口文档，先直接运行解析器
#   2. 如果某个字段没被识别出来，打开此文件
#   3. 在对应的统一字段名下面，添加你的列名
#   4. 保存后重新运行解析器即可
#
# 【配置规则】
#   - 每个统一字段名下面是一个列表，列表中是各种变体名称
#   - 匹配时忽略大小写、前后空格、换行符
#   - 新增变体只需在列表末尾加一行，格式：- "你的列名"
#
# 【示例】
#   假设你的文档表头是：| 编号 | 字段含义 | 数据规格 | 是否为空 |
#   你只需要在对应位置添加：
#     field_name:
#       - "编号"          # ← 新增
#     field_chinese_name:
#       - "字段含义"       # ← 新增
#     data_type:
#       - "数据规格"       # ← 新增
#     required:
#       - "是否为空"       # ← 新增
#
# =============================================================================


# =============================================================================
# 第一部分：字段映射（核心配置）
# =============================================================================
# 将文档中的列名映射到统一字段名
# 每个统一字段名下有多个变体（不同文档的不同叫法）

fields:

  # ---- 字段名/代码 ----
  # 作用：标识字段的英文名/编码/标识符
  # 示例：HOSPITAL_ID、DEPT_CODE、patient_id
  field_name:
    - "字段名"           # 通用叫法
    - "字段代码"         # 通用叫法
    - "数据字段名"       # 医院端数据格式v3.3
    - "数据元标识符"     # 卫健委标准规范
    - "数据项代码"       # 广东省智慧健康标准
    - "程序字段名"       # 医院端数据格式v3.3
    - "名称"            # 智慧病房查询接口、自助机接口
    - "代码"            # 字典类表格
    - "FIELD_NAME"       # 英文文档
    - "接口字段名"       # 通用叫法
    - "数据元英文名称"   # 四川省智慧健康数据采集标准
    - "数据列名"         # 四川省智慧健康数据采集标准

  # ---- 字段中文名/说明 ----
  # 作用：标识字段的中文名称/含义/描述
  # 示例：医院编码、患者姓名、科室名称
  field_chinese_name:
    - "中文名"           # 福建省三医一张网标准
    - "字段名称"         # 绩效接口、智慧病房管理系统
    - "数据元名称"       # 卫健委标准规范
    - "数据项名称"       # 广东省智慧健康标准
    - "数据项"           # 福建省三医一张网标准
    - "所需字段"         # 医院端数据格式v3.3
    - "字段描述"         # 智慧病房管理系统接口
    - "字段说明"         # 绩效接口HIS系统
    - "数据字段"         # 通用叫法
    - "数据名称"         # 目录类表格
    - "数据元中文名称"   # 四川省智慧健康数据采集标准
    - "数据项中文名称"   # 四川省智慧健康数据采集标准（同文档变体）
    - "属性"            # 通用叫法（字段含义/中文名）

  # ---- 数据类型 ----
  # 作用：标识字段的数据类型
  # 示例：varchar、nvarchar、int、date
  data_type:
    - "数据类型"         # 通用叫法
    - "字段格式"         # 医院端数据格式v3.3
    - "类型"            # 简写
    - "DATATYPE"         # 英文文档
    - "数据规格"         # 可能的变体

  # ---- 数据长度 ----
  # 作用：标识字段的长度/大小
  # 示例：50、100、255
  data_length:
    - "数据长度"         # 通用叫法
    - "长度"            # 广东省标准、单病种
    - "类型长度"         # 福建省三医一张网标准
    - "长度（字节）"     # 自助机接口
    - "长度（字节"       # PDF换行截断的情况
    - "SIZE"            # 英文文档

  # ---- 是否必填 ----
  # 作用：标识字段是否为必填项
  # 示例：Y/N、是/否、必填/选填
  required:
    - "是否必填"         # 通用叫法
    - "非空"            # 医院端数据格式v3.3
    - "必填"            # 简写
    - "必选项"          # 自助机接口
    - "报送要求"         # 福建省三医一张网标准
    - "填报要求"         # 福建省三医一张网标准
    - "Nullable"         # 英文文档

  # ---- 是否主键 ----
  # 作用：标识字段是否为主键
  # 示例：Y/N、是/否
  is_key:
    - "主键"            # 广东省标准
    - "是否主键"         # 绩效接口
    - "PRIMARY_KEY"      # 英文文档

  # ---- 备注/说明 ----
  # 作用：字段的补充说明、示例值、关联信息等
  description:
    - "备注"            # 通用叫法
    - "说明"            # 通用叫法
    - "字段说明"         # 通用叫法
    - "参考值"          # 通用叫法
    - "参考范例"         # 绩效接口HIS系统
    - "关联"            # 绩效接口（关联标识）
    - "代码标识"         # 绩效接口（代码标识）
    - "约束"            # 智慧病房查询接口
    - "值域"            # 广东省标准
    - "校验规则"         # 四川省智慧健康标准
    - "值域规范"         # 四川省智慧健康标准
    - "值域代码"         # 四川省智慧健康标准（同文档变体）
    - "来源标准"         # 四川省智慧健康标准

  # ---- 序号 ----
  # 作用：行号/序号（用于判断是否是数据行）
  # 此字段会被解析但不参与代码生成
  seq:
    - "序号"            # 通用叫法
    - "No"              # 英文文档
    - "序号"            # 重复项，确保匹配


# =============================================================================
# 第二部分：表格分类配置
# =============================================================================
# 用于判断一个表格是否是"字段定义表"
# 一般不需要修改

table_classifier:

  # 最小命中核心字段数
  # 含义：一个表格至少要命中几个核心字段，才被认为是字段定义表
  # 核心字段包括：field_name、field_chinese_name、data_type
  # 建议值：2（命中2个以上核心字段才算有效）
  min_core_fields: 2

  # 最小数据行数
  # 含义：一个表格至少要有几行数据，才被认为是有效表格
  # 用于过滤掉空表和分隔符表
  min_rows: 2

  # 核心字段列表
  # 这些字段是判断表格类型的关键
  core_fields:
    - field_name
    - field_chinese_name
    - data_type

  # 跳过关键词
  # 含义：如果表头的所有列名都在此列表中，则跳过该表格
  # 用于过滤掉目录表、汇总表等非字段定义表
  # 注意：是精确匹配，不会因为表头"包含"这些词就跳过
  skip_keywords:
    - "总计"
    - "合计"
    - "版本"
    - "目录"
    - "清单"


# =============================================================================
# 第三部分：视图标识提取配置
# =============================================================================
# 用于从文档中提取数据表/视图的名称和代码
# 一般不需要修改

view_identifier:

  # 正则模式列表
  # 按优先级从高到低尝试匹配
  patterns:
    # 模式1：中文名（英文名）
    # 示例：患者基本信息（DBZ_JBXX）
    # 提取：view_code=DBZ_JBXX, view_name=患者基本信息
    - '([一-龥]+)[（(]([A-Za-z_]\w+)[)）]'

    # 模式2：纯英文标识符
    # 示例：outp_register_record
    # 提取：view_code=outp_register_record
    - '([A-Za-z_]\w+)'

  # XLSX 文件特殊配置
  xlsx:
    # 从第一行提取视图代码的正则
    first_row_pattern: '([A-Za-z_]\w+)'

    # 从 Sheet 名提取视图名称的正则
    # 示例：1科室字典 → 科室字典
    sheet_name_pattern: '^[\d]+[、.]?\s*(.+)'
